services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fdi
      POSTGRES_USER: fdi
      POSTGRES_PASSWORD: fdi_local_only
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  api:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://fdi:fdi_local_only@db:5432/fdi
    ports: ["8000:8000"]
  demo:
    build: .
    command: ["streamlit", "run", "web/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
volumes:
  pgdata:
